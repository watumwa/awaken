{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Free Christian books and ministry resources from Awakening Saints.">
    <title>{% block title %}Awakening Saints{% endblock %}</title>
    <link rel="shortcut icon" type="image/png" href="{% static 'assets/images/logo.png' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{% static 'assets/css/style-starter.css' %}">
    <style>
        :root {
            --as-blue: #1098e8;
            --as-blue-dark: #0879bd;
            --as-navy: #102a43;
            --as-text: #243b53;
            --as-muted: #627d98;
            --as-border: #d9e2ec;
            --as-bg: #f7f9fc;
            --as-white: #ffffff;
        }

        html { scroll-behavior: smooth; }
        body { margin: 0; background: var(--as-bg); color: var(--as-text); }

        /* Keep the fixed header above all book-page content. */
        #site-header { z-index: 1040; }

        .book-page-main {
            min-height: 70vh;
            padding-top: 86px;
        }

        .book-page-wrap {
            width: min(1180px, calc(100% - 32px));
            margin: 0 auto;
        }

        .book-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            min-height: 44px;
            padding: 10px 16px;
            border: 1px solid transparent;
            border-radius: 9px;
            font-weight: 700;
            line-height: 1.2;
            text-decoration: none !important;
            cursor: pointer;
            transition: transform .18s ease, box-shadow .18s ease, background .18s ease;
        }

        .book-btn:hover { transform: translateY(-1px); }
        .book-btn-primary { color: #fff !important; background: var(--as-blue); }
        .book-btn-primary:hover { background: var(--as-blue-dark); box-shadow: 0 7px 18px rgba(16, 152, 232, .22); }
        .book-btn-secondary { color: var(--as-navy) !important; background: #fff; border-color: var(--as-border); }
        .book-btn-secondary:hover { background: #f0f4f8; }

        @media (max-width: 767px) {
            .book-page-main { padding-top: 76px; }
            .book-page-wrap { width: min(100% - 24px, 1180px); }
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
    {% include 'navbar.html' %}

    <main class="book-page-main">
        {% block content %}{% endblock %}
    </main>

    {% include 'footer.html' %}

    <!-- One Bootstrap 5 bundle only. Mixing Bootstrap 4 and 5 was causing dropdown/toggler UI conflicts. -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
