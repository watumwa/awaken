{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{% block meta_description %}Awakening Saints — a prophetic ministry sharing free Christian books, sermons and resources.{% endblock %}">
    <title>{% block title %}Awakening Saints{% endblock %}</title>
    <link rel="shortcut icon" type="image/png" href="{% static 'assets/images/logo.png' %}">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'assets/css/style-starter.css' %}">
    <link rel="stylesheet" href="{% static 'css/main.css' %}">
    <link rel="stylesheet" href="{% static 'css/tokens.css' %}">

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <style>
        /* Only modify dropdown item layout, not visibility. */
        .dropdown-menu li { display: block; }
        .dropdown-item { display: block; width: 100%; }

        .loader-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #fff;
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .spinner {
            border: 6px solid #ddd;
            border-top: 6px solid var(--color-primary);
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Keep the fixed header above all page content. */
        #site-header { z-index: 1040; }

        /*
         * Most page sections (hero banners, breadcrumb headers) already carry
         * their own margin-top to clear the fixed navbar. The book pages don't,
         * so they opt into this instead of double-offsetting everyone else.
         */
        .book-page-main { padding-top: 86px; }

        @media (max-width: 767px) {
            .book-page-main { padding-top: 76px; }
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
    <div id="loader" class="loader-overlay">
        <div class="spinner"></div>
    </div>

    {% include 'navbar.html' %}

    <main class="{% block main_class %}{% endblock %}">
        {% block content %}{% endblock %}
    </main>

    {% include 'footer.html' %}

    <script>
        window.addEventListener('load', function () {
            var loader = document.getElementById('loader');
            if (loader) loader.style.display = 'none';
        });
    </script>

    <!-- One Bootstrap 5 bundle only — mixing Bootstrap 4 and 5 was causing dropdown/toggler UI conflicts. -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Keep mobile menu state, scroll locking and accessibility in sync with
        // Bootstrap's real collapse state (including outside-click and resize).
        document.addEventListener('DOMContentLoaded', function () {
            var header = document.getElementById('site-header');
            var menu = document.getElementById('navbarTogglerDemo02');
            var toggler = header && header.querySelector('.navbar-toggler');
            if (!header || !menu || !toggler || !window.bootstrap) return;

            var collapse = bootstrap.Collapse.getOrCreateInstance(menu, { toggle: false });

            function setMenuState(isOpen) {
                header.classList.toggle('mobile-menu-open', isOpen);
                document.body.classList.toggle('noscroll', isOpen);
                toggler.setAttribute('aria-label', isOpen ? 'Close navigation menu' : 'Open navigation menu');
            }

            menu.addEventListener('show.bs.collapse', function () { setMenuState(true); });
            menu.addEventListener('hidden.bs.collapse', function () { setMenuState(false); });

            menu.querySelectorAll('a:not(.dropdown-toggle)').forEach(function (link) {
                link.addEventListener('click', function () {
                    if (window.innerWidth < 992) collapse.hide();
                });
            });

            document.addEventListener('keydown', function (event) {
                if (event.key === 'Escape' && menu.classList.contains('show')) {
                    collapse.hide();
                    toggler.focus();
                }
            });

            window.addEventListener('resize', function () {
                if (window.innerWidth >= 992 && menu.classList.contains('show')) collapse.hide();
                if (window.innerWidth >= 992) setMenuState(false);
            });
        });
    </script>
    {% block extra_js %}{% endblock %}
</body>
</html>
